name: Publish verified package to PyPI
run-name: "PyPI ${{ inputs.stable_tag }}"
'on':
  workflow_dispatch:
    inputs:
      stable_tag:
        description: Existing verified stable release (vX.Y.Z)
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: pypi-${{ github.repository }}
  cancel-in-progress: false
jobs:
  verify-pypi:
    if: ${{ github.repository == 'victron-venus/inverter-climate' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      receipt-sha256: ${{ steps.verify.outputs.receipt-sha256 }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify immutable release evidence and stage the original distributions
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          GODEBUG: http2client=0
          STABLE_TAG: ${{ inputs.stable_tag }}
        run: |
          digest=$(python3 scripts/stage_verified_pypi.py --tag "$STABLE_TAG")
          echo "receipt-sha256=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: verified-pypi-${{ github.run_id }}-${{ github.run_attempt }}
          path: verified-pypi/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
  publish-pypi:
    needs: verify-pypi
    environment: pypi
    if: ${{ github.repository == 'victron-venus/inverter-climate' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify-pypi.outputs.artifact-id }}
          path: verified-pypi
          merge-multiple: true
      - name: Verify the exact transferred inventory and bytes
        env:
          RECEIPT_SHA256: ${{ needs.verify-pypi.outputs.receipt-sha256 }}
          STABLE_TAG: ${{ inputs.stable_tag }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          root = Path('verified-pypi')
          receipt = root / 'receipt.json'
          if receipt.is_symlink() or not receipt.is_file():
              raise SystemExit('Missing regular publication receipt')
          raw = receipt.read_bytes()
          if hashlib.sha256(raw).hexdigest() != os.environ['RECEIPT_SHA256']:
              raise SystemExit('Publication receipt changed in transit')
          data = json.loads(raw)
          tag = os.environ['STABLE_TAG']
          if not re.fullmatch(r'v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)', tag):
              raise SystemExit('An exact stable tag is required')
          if (data['schema'], data['repository'], data['project'], data['stable_tag'], data['version']) != (1, 'victron-venus/inverter-climate', 'inverter-climate', tag, tag[1:]):
              raise SystemExit('Unexpected publication identity')
          files = data['files']
          names = [item['name'] for item in files]
          if len(names) != 1 or len(set(names)) != 1 or any(Path(name).name != name for name in names):
              raise SystemExit('Invalid publication inventory')
          dist = root / 'dist'
          if dist.is_symlink() or not dist.is_dir() or {path.name for path in dist.iterdir()} != set(names):
              raise SystemExit('Transferred distribution inventory changed')
          for item in files:
              path = dist / item['name']
              if path.is_symlink() or not path.is_file():
                  raise SystemExit('Distribution must be a regular file')
              raw = path.read_bytes()
              if len(raw) != item['size'] or hashlib.sha256(raw).hexdigest() != item['sha256']:
                  raise SystemExit('Distribution changed in transit')
          print('Verified original wheel; no rebuild performed')
          PY
      - name: Publish the verified distributions using the existing PyPI trust
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: verified-pypi/dist/
          verify-metadata: true
          skip-existing: false
