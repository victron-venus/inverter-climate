# Keep all repository files in scope; classify the actual test trees separately.
sonar.sources=.
sonar.tests=tests,.github/release-tests,.github/workflow-tests
sonar.exclusions=tests/**,.github/release-tests/**,.github/workflow-tests/**

# pyproject.toml requires Python >=3.12; list the currently supported analyzer versions.
sonar.python.version=3.12,3.13,3.14
